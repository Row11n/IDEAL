# Configuration for AR training matching train_AR.sh defaults
tokenizer_config: configs/tokenizer/ideal-tokenizer.yaml
data_path: ImageNet/train
crop_range: 1.1
pipe_name: ""
gpt_model: GPT-L
gpt_ckpt: null
gpt_type: c2i
vocab_size: 16384
latent_size: 24
ema: true
cls_token_num: 1
dropout_p: 0.1
token_dropout_p: 0.1
drop_path_rate: 0.0
results_dir: output
dataset: imagenet_code
code_path: data/imagenet_codes/
image_size: 384
downsample_size: 16
num_classes: 1000
epochs: 300
lr: 0.0001
weight_decay: 0.05
beta1: 0.9
beta2: 0.95
max_grad_norm: 1.0
global_batch_size: 256
global_seed: 42
num_workers: 32
log_every: 100
ckpt_every: 25020
gradient_accumulation_steps: 1
mixed_precision: bf16

vq_model: IDEAL
vq_ckpt: weights/ideal-tokenizer.pth
codebook_size: 16384
codebook_embed_dim: 64
z_channels: 1024
